<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Cheddar Vox · Local object detection</title><style>body{font:16px system-ui;background:#fffdf8;color:#172033;max-width:1000px;margin:32px auto;padding:16px}button,input{min-height:44px;font:inherit;border:1px solid #2563eb;border-radius:8px;padding:0 12px}button{background:#ffb82e;cursor:pointer}video{width:100%}.frame{position:relative}.frame img{width:100%;display:block}.box{position:absolute;border:2px solid #2563eb;box-sizing:border-box;pointer-events:none}.box span{background:#dbEafe}li{padding:12px;border-bottom:1px solid #ddd}#result:empty{display:none}</style><h1>Find objects in a video frame</h1><p>Local test · Search by object name. Every result needs your review. This does not follow objects between frames.</p><video controls muted src="/public/videos/iron-e05a44b0.mp4"></video><p><label>Objects to find <input id="labels" value="clothes iron, hand, shirt"></label> <button id="detect">Find in this frame</button></p><p id="status" role="status">Pause at a frame, then find objects.</p><div class="frame"><img id="frame" hidden><div id="boxes"></div></div><ul id="result"></ul><script>
const v=document.querySelector('video'),button=document.querySelector('#detect'),status=document.querySelector('#status');let run=0;button.onclick=async()=>{const id=++run;button.disabled=true;v.pause();document.querySelector('#result').replaceChildren();document.querySelector('#boxes').replaceChildren();try{if(v.readyState<2)throw Error('Wait for the video to load');const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);const image=c.toDataURL();const frame=document.querySelector('#frame');frame.src=image;frame.hidden=false;status.textContent='Finding objects locally. The first run downloads the model; later runs use the cached copy.';const response=await fetch('/detect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image,labels:document.querySelector('#labels').value.split(',').map(s=>s.trim()).filter(Boolean)})});const data=await response.json();if(!response.ok)throw Error(data.error);if(id!==run)return;status.textContent=data.proposals.length?`${data.proposals.length} suggestions · ${(data.ms/1000).toFixed(2)} seconds · Needs review`:'No suggestions in this frame. Try another frame or object name.';for(const p of data.proposals){const box=document.createElement('div');box.className='box';const b=p.box;Object.assign(box.style,{left:Math.max(0,b.xmin)/c.width*100+'%',top:Math.max(0,b.ymin)/c.height*100+'%',width:(Math.min(c.width,b.xmax)-Math.max(0,b.xmin))/c.width*100+'%',height:(Math.min(c.height,b.ymax)-Math.max(0,b.ymin))/c.height*100+'%'});const title=document.createElement('span');title.textContent=p.label;box.append(title);document.querySelector('#boxes').append(box);const li=document.createElement('li');const text=document.createElement('span');text.textContent=`${p.label} · model score ${p.score.toFixed(3)} · Needs review `;li.append(text);for(const [label,state]of[['Confirm','Confirmed locally'],['Disqualify','Disqualified']]){const action=document.createElement('button');action.textContent=label;action.onclick=()=>{text.textContent=p.label+' · '+state+' ';li.querySelectorAll('button').forEach(b=>b.disabled=true);if(state==='Disqualified')box.remove();};li.append(action);}document.querySelector('#result').append(li);}}catch(e){status.textContent=e.message+' — Try again.';}finally{button.disabled=false;}};
</script>
