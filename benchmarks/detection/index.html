<!doctype html><meta charset="utf-8"><title>Local detection benchmark</title><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script><video id="clip" muted src="/public/videos/iron-e05a44b0.mp4"></video><pre id="status">Loading local trial</pre><script>
window.runDetection=async()=>{const v=document.querySelector('video');v.src=URL.createObjectURL(await (await fetch('/public/videos/iron-e05a44b0.mp4')).blob());v.load();if(v.readyState<2)await new Promise((r,j)=>{v.onloadeddata=r;v.onerror=()=>j(Error('Video failed'));});const start=performance.now();const model=await cocoSsd.load({base:'lite_mobilenet_v2'});const loadMs=performance.now()-start;const rows=[];for(const time of [0,11,15,20,30,40]){if(v.currentTime!==time){await new Promise((r,j)=>{const presented=(_,m)=>{if(Math.abs(m.mediaTime-time)<.1)r();else v.requestVideoFrameCallback(presented);};v.requestVideoFrameCallback(presented);v.currentTime=time+1/48;setTimeout(()=>j(Error('Seek timeout')),10000);});}const t=performance.now();const predictions=await model.detect(v,20,.5);rows.push({time,ms:performance.now()-t,proposals:predictions.map(p=>({...p,status:'Needs review',accepted:false}))});}model.dispose();const result={model:'COCO-SSD lite_mobilenet_v2',loadMs,rows};document.querySelector('#status').textContent=JSON.stringify(result,null,2);return result;};
</script>
